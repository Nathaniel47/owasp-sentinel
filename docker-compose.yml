services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/sentinel.db
    volumes:
      - ./results:/app/results
      - sentinel-data:/data

  scanner:
    build:
      context: .
      target: scanner
    profiles: ["scan"]
    volumes:
      - ./targets:/targets:ro
      - ./results:/out

volumes:
  sentinel-data:
