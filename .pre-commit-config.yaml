repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: check-secrets
        name: block API keys and secrets
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: true
        types: [text]
